# Concurrent Ticket System Configuration
# Modify these values to customize system behavior

# Ticket Machine Initial Resources
ticket.machine.paper.initial=120
ticket.machine.toner.initial=80

# Thread Pool Sizes
thread.pool.passengers.size=6
thread.pool.technicians.size=2

# Monitoring Settings
monitoring.interval.ms=3000

# Circuit Breaker Settings
circuit.breaker.failure.threshold=5
circuit.breaker.success.threshold=3
circuit.breaker.timeout.ms=45000

# System Performance
operation.timeout.ms=8000
operation.retry.attempts=2
